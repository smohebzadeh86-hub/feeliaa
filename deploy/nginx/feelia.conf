# Feelia — کانفیگِ مرجعِ nginx (REFERENCE — با کانفیگِ زنده‌ی سرور مقایسه نشده)
#
# ⚠ این فایل مستقیم جایگزینِ کانفیگِ سرور نشود. کانفیگِ واقعیِ feelia.ir در repo نیست و از ماشینِ dev
#   قابلِ خواندن نبود (2026-09-23). روی سرور اول بخوانید:  nginx -T | less
#   سپس فقط بلوک‌هایِ لازم را ادغام کنید → nginx -t → systemctl reload nginx (نه restart).
#   مسیرِ گواهی‌ها (ssl_certificate) را از کانفیگِ فعلیِ سرور بردارید.
#
# چه چیزهایی عمداً از الگوهایِ رایج کپی نشده (برایِ فیلیا خطرناک‌اند):
#   - Permissions-Policy با microphone=()  → ضبطِ جلسه را کامل از کار می‌اندازد.
#   - Cache-Control: max-age=… روی *.js / index.html → همان باگِ اجرایِ feelia-rt.jsِ قدیمی (2026-09-23).
#     اپ خودش no-cache می‌فرستد؛ nginx نباید آن را override کند.
#   - CSPِ سخت‌گیرانه بدونِ تست → اتصالِ مستقیمِ مرورگر به wss://stt-rt.soniox.com، Google Fonts
#     و Clarity را می‌بندد (LAW-014). اگر CSP لازم شد، جدا و با تست اضافه شود.
#   - proxy_cache / کش روی /api → داده‌ی بالینی (LAW-001).

upstream feelia_app {
    server 127.0.0.1:3000;
    # اتصال‌هایِ keepalive به Node؛ timeoutِ nginx (۶۰ث) کمتر از keepAliveTimeoutِ Fastify (۷۲ث) است
    # تا nginx هرگز رویِ سوکتی که Node بسته درخواست نفرستد (منبعِ 502ِ تصادفی).
    keepalive 32;
}

# فقط برایِ مسیرِ legacyِ /ws/* (LAW-015)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name feelia.ir www.feelia.ir;
    return 301 https://feelia.ir$request_uri;
}

server {
    listen 443 ssl http2;
    server_name feelia.ir www.feelia.ir;

    # ssl_certificate     /etc/letsencrypt/live/feelia.ir/fullchain.pem;   # ← از کانفیگِ فعلی
    # ssl_certificate_key /etc/letsencrypt/live/feelia.ir/privkey.pem;     # ← از کانفیگِ فعلی

    server_tokens off;

    # ---- بدنه و timeoutها ----
    # اپ تا ۱۰MB فایلِ multipart می‌پذیرد (server/src/index.ts)؛ پیش‌فرضِ nginx ۱MB است → 413.
    client_max_body_size 12m;
    # آپلودِ سگمنتِ صدا از اینترنتِ ضعیفِ موبایل.
    client_body_timeout 120s;
    send_timeout 120s;

    # ---- gzip (اپ خودش فشرده نمی‌کند؛ index.html حدودِ ۴۱۰KB است) ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    # text/html همیشه به‌طورِ پیش‌فرض فشرده می‌شود.

    # ---- هدرهایِ امنیتیِ کم‌خطر ----
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=(), usb=()" always;

    # ---- تنظیماتِ مشترکِ proxy ----
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 90s;

    # تولیدِ پرونده‌ی درمان یک درخواستِ همگامِ چنددقیقه‌ای است (timeoutِ LLM ۵ دقیقه؛ کلاینت ۱۰ دقیقه
    # صبر می‌کند). با پیش‌فرضِ ۶۰ث، nginx 504 برمی‌گرداند در حالی که سرور هنوز در حالِ تولید است.
    location ~ ^/api/clients/[^/]+/case-file/regenerate$ {
        proxy_pass http://feelia_app;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
    }

    # سگمنت‌ها/یادداشتِ صوتی: بدنه بافر نشود تا اینترنتِ ضعیف دوبار منتظر نماند.
    location ~ ^/api/sessions/[^/]+/(batch-audio|voice-note)$ {
        proxy_pass http://feelia_app;
        proxy_request_buffering off;
        proxy_read_timeout 180s;
    }

    # آپلودِ فایلِ صوتیِ جلسه (2026-09-23): تکه‌هایِ ۴MB (زیرِ client_max_body_size بالا) — بدنه بافر نشود.
    location ~ ^/api/uploads/[^/]+/chunks/\d+$ {
        proxy_pass http://feelia_app;
        proxy_request_buffering off;
        proxy_read_timeout 180s;
        # عمداً بدونِ add_header — وگرنه هدرهایِ امنیتیِ سطحِ server برایِ این location حذف می‌شوند.
    }
    # complete: الحاق + بررسیِ ffmpeg رویِ فایلِ تا ۱GB ممکن است چند ده ثانیه طول بکشد.
    location ~ ^/api/uploads/[^/]+/complete$ {
        proxy_pass http://feelia_app;
        proxy_read_timeout 300s;
    }

    # پخشِ صدایِ ادمین (stream) — بدونِ بافرِ کاملِ پاسخ.
    location ~ ^/api/admin/.*/(audio|stream|full)$ {
        proxy_pass http://feelia_app;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # API — هرگز کش نشود (داده‌ی بالینی).
    location /api/ {
        proxy_pass http://feelia_app;
        add_header Cache-Control "no-store" always;
        # چون add_header در location، هدرهایِ server را غیرفعال می‌کند، تکرار:
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=(), usb=()" always;
    }

    # WebSocketِ legacy (/ws/t، /ws/voice — LAW-015).
    location /ws/ {
        proxy_pass http://feelia_app;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # فرانت (index.html، feelia-*.js) — Cache-Control را خودِ اپ (no-cache + ETag) تعیین می‌کند.
    location / {
        proxy_pass http://feelia_app;
    }
}
